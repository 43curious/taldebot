name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LOCAL_DATABASE_URL: file:/tmp/taldebot-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -- --local
      - run: npm run check
      - run: npm test
      - run: npm run build
